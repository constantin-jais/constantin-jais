name: Stack conventions

# Successor of the retired ecosystem-health workflow (monorepo ADR-0008 cleanup):
# same required check name, but it asserts the LIVING control-plane structure
# instead of the retired pre-Big-Bang fleet machinery.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stack-conventions:
    name: Stack workflow conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Living control-plane documents exist
        run: |
          set -euo pipefail
          test -s README.md
          test -s SECURITY.md
          test -s .github/CODEOWNERS
          test -s ecosystem/governance/upstream-contributions.md
          grep -q "APPROVE_UPSTREAM_PUSH" ecosystem/governance/upstream-contributions.md
          grep -q "APPROVE_READY_FOR_REVIEW" ecosystem/governance/upstream-contributions.md
          test -s ecosystem/specs/shared/decision-log.md
          test -s ecosystem/plans/cold-backlog.md
          test -s ecosystem/plans/orchestrator-lock-inputs.md
      - name: Retired strata stay retired (option B — main is current truth only)
        run: |
          set -euo pipefail
          for p in ecosystem/status.md ecosystem/remaining-work.md \
                   ecosystem/repos-inventory.md ecosystem/target-version.md \
                   ecosystem/product-portfolio.md ecosystem/product-readiness.md \
                   ecosystem/maturity ecosystem/specs/rumble-note ecosystem/specs/gear; do
            if [ -e "$p" ]; then
              echo "$p reappeared on main; history lives in the archive tag"
              exit 1
            fi
          done
          git fetch --quiet --tags origin
          git tag -l 'archive/pre-constellation-*' | grep -q . || {
            echo "archive tag missing"; exit 1
          }
      # Frontier controls. They are wired HERE, inside an already-required job,
      # on purpose: a new workflow would produce a check that is not required and
      # therefore mergeable while red — decoration, not a gate. Each control
      # prints how many items it examined and fails when that number is zero, so
      # "found nothing" can never be confused with "could not look".
      - name: Actions pinned to commit SHAs (every tracked workflow)
        run: sh ecosystem/tools/checks/check-action-pinning.sh

      - name: Operational documents cite only paths that exist
        run: python3 ecosystem/tools/checks/check-doc-paths.py

      # The next two carry a nominative exemption for the Harness Vertical P0
      # stratum, frozen as trace by control-plane ADR 0047 §3. Each exemption is
      # a two-way join: an unnamed offender fails the job, and so does a named
      # path that has stopped being an offender. An exemption that cannot expire
      # is a permanent hole reporting itself as coverage.
      - name: Workflows live only under the root .github/workflows/
        run: sh ecosystem/tools/checks/check-workflow-location.sh

      - name: No tracked script resolves a path above the repository root
        run: python3 ecosystem/tools/checks/check-repo-escape.py

      - name: Retired brands stay out of living documents
        run: |
          set -euo pipefail
          matches=$(grep -rn -E "Daidalos|free-ai\.fr" \
            README.md ROADMAP.md CONTRIBUTING.md SECURITY.md \
            ecosystem/plans/ ecosystem/target-version.md \
            ecosystem/product-portfolio.md ecosystem/product-readiness.md \
            2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "A retired brand resurfaced in a living control-plane document."
            exit 1
          fi
