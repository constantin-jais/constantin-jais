name: Ecosystem health

# This job is a required status check. It must report on every pull request;
# do not add a pull_request path filter.
on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "ecosystem/**"
      - "SECURITY.md"
      - ".github/CODEOWNERS"
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

jobs:
  stack-conventions:
    name: Stack workflow conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Current ecosystem documents exist
        run: |
          set -euo pipefail
          test -s README.md
          test -s ecosystem/status.md
          test -s ecosystem/repos-inventory.md
          test -s ecosystem/target-version.md
          test -s ecosystem/governance/repo-profiles.json
          test -s ecosystem/governance/branch-policy.json
          test -s ecosystem/governance/upstream-contributions.md
          test -s ecosystem/specs/shared/dioxus-target-evidence.md
          grep -q "APPROVE_UPSTREAM_PUSH" ecosystem/governance/upstream-contributions.md
          grep -q "APPROVE_READY_FOR_REVIEW" ecosystem/governance/upstream-contributions.md
          test -s SECURITY.md
          test -s .github/CODEOWNERS
          grep -q "## Promotion criteria" ecosystem/status.md
          grep -q "trusted.*scale-ready" ecosystem/status.md

      - name: Public repository profiles are coherent
        run: python3 ecosystem/governance/validate_repo_profiles.py

      - name: Policy file is valid against the engine
        run: |
          python3 - <<'PY'
          import pathlib
          import sys

          sys.path.insert(0, "ecosystem/governance")
          import ecosystem_policy

          policy = ecosystem_policy.load_policy(
              pathlib.Path("ecosystem/governance/branch-policy.json")
          )
          for repo in policy["repos"]:
              ecosystem_policy.desired_ruleset(policy, repo)
          print(f"policy OK: {len(policy['repos'])} repo(s)")
          PY

      - name: Workflow actions are SHA-pinned
        run: |
          set -euo pipefail
          if grep -RInE 'uses: [^#]+@(v[0-9]+|stable|main|master|cargo-[a-z-]+)' .github/workflows; then
            echo "::error::workflow action is not pinned to a commit SHA"
            exit 1
          fi
