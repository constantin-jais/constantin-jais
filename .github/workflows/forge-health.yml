name: Forge health

# The "Stack workflow conventions" job is a required status check on main.
# Required checks must run on EVERY pull request or the merge waits forever
# on an `expected` check (ADR 0031). So: no `paths:` filter on pull_request;
# an in-job guard no-ops quickly when nothing relevant changed.
on:
  push:
    branches: [main]
    paths:
      - "docs/forge.md"
      - "ecosystem/forge-health.md"
      - "ecosystem/status.md"
      - "ecosystem/maturity/*.json"
      - "SECURITY.md"
      - ".github/CODEOWNERS"
      - ".github/workflows/**"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

jobs:
  stack-conventions:
    name: Stack workflow conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Detect relevant changes
        id: relevant
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- \
            docs/forge.md \
            ecosystem/forge-health.md \
            ecosystem/status.md \
            'ecosystem/maturity/*.json' \
            SECURITY.md \
            .github/CODEOWNERS \
            .github/workflows/ \
            | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No forge-health-relevant paths changed; reporting success."
          fi
      - name: Local forge docs and maturity criteria exist
        if: steps.relevant.outputs.changed == 'true'
        run: |
          set -euo pipefail
          test -s docs/forge.md
          test -s ecosystem/forge-health.md
          test -s ecosystem/status.md
          test -s SECURITY.md
          test -s .github/CODEOWNERS
          grep -q "## Promotion criteria" ecosystem/status.md
          grep -q "trusted.*scale-ready" ecosystem/status.md
      - name: Local workflow actions are SHA-pinned
        if: steps.relevant.outputs.changed == 'true'
        run: |
          set -euo pipefail
          if grep -RInE 'uses: [^#]+@(v[0-9]+|stable|main|master|cargo-[a-z-]+)' .github/workflows; then
            echo "::error::local workflow action is not pinned to a commit SHA"
            exit 1
          fi
      - name: Public workflow inventory smoke
        if: steps.relevant.outputs.changed == 'true'
        run: |
          set -euo pipefail
          repos=(
            cos-matic
            wrench-db-inspect
            wrench-loader
            gear-memory
            gear-depot
            gear-cable
            rumble-feed-mind
            rumble-lm
            rumble-cos
          )
          for repo in "${repos[@]}"; do
            echo "== $repo =="
            if ! curl -fsSL "https://api.github.com/repos/constantin-jais/${repo}/contents/.github/workflows/security.yml" >/dev/null; then
              echo "::warning::${repo} is missing .github/workflows/security.yml on default branch"
            fi
            if curl -fsSL "https://api.github.com/repos/constantin-jais/${repo}/contents/.github/workflows/ci.yml" >/dev/null; then
              echo "ci.yml: ok"
            elif curl -fsSL "https://api.github.com/repos/constantin-jais/${repo}/contents/.github/workflows/rust-ci.yml" >/dev/null; then
              echo "rust-ci.yml: ok"
            else
              echo "::warning::${repo} is missing ci.yml/rust-ci.yml on default branch"
            fi
            if ! curl -fsSL "https://api.github.com/repos/constantin-jais/${repo}/contents/SECURITY.md" >/dev/null; then
              echo "::warning::${repo} is missing SECURITY.md on default branch"
            fi
            if ! curl -fsSL "https://api.github.com/repos/constantin-jais/${repo}/contents/.github/CODEOWNERS" >/dev/null; then
              echo "::warning::${repo} is missing .github/CODEOWNERS on default branch"
            fi
          done
