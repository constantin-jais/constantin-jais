name: Spec contract validation

# The "json-schema-fixtures" job is a required status check on main.
# Required checks must run on EVERY pull request or the merge waits forever
# on an `expected` check (ADR 0031). So: no `paths:` filter on pull_request;
# an in-job guard no-ops quickly when nothing relevant changed.
on:
  push:
    paths:
      - "ecosystem/specs/**/*.json"
      - "ecosystem/specs/**/*.py"
      - "ecosystem/specs/**/*.sh"
      - "ecosystem/specs/requirements-ci.txt"
      - "ecosystem/specs/contract-validation.md"
      - "ecosystem/specs/shared/adrs/*.md"
      - "ecosystem/target-version.v1.json"
      - ".github/workflows/spec-contracts.yml"
  pull_request:
  workflow_dispatch:

jobs:
  json-schema-fixtures:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: relevant
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- \
            'ecosystem/specs/**/*.json' \
            'ecosystem/specs/**/*.py' \
            'ecosystem/specs/**/*.sh' \
            'ecosystem/specs/shared/adrs/*.md' \
            ecosystem/specs/requirements-ci.txt \
            ecosystem/specs/contract-validation.md \
            ecosystem/target-version.v1.json \
            .github/workflows/spec-contracts.yml \
            | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No spec-contract-relevant paths changed; reporting success."
          fi

      - name: ADR number uniqueness (all ADR files)
        if: steps.relevant.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cd ecosystem/specs/shared/adrs
          # DC-7 hardening (2026-07-09): superseded ADRs used to escape this
          # check, which let two 0023 files coexist for a week. Duplicate
          # numbers are now rejected across ALL files — fuse or renumber.
          dups=$(ls [0-9][0-9][0-9][0-9]-*.md | cut -d- -f1 | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "Duplicate ADR numbers (superseded included — fuse or renumber):$dups" >&2
            exit 1
          fi
          echo "ADR numbering unique across all ADR files."

      - name: Set up Python
        if: steps.relevant.outputs.changed == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate JSON Schemas and fixtures
        if: steps.relevant.outputs.changed == 'true'
        run: sh ecosystem/specs/ci-validate-contracts.sh
