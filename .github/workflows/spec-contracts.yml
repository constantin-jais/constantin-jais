name: Spec contract validation

on:
  push:
    paths:
      - "ecosystem/specs/**/*.json"
      - "ecosystem/specs/**/*.py"
      - "ecosystem/specs/**/*.sh"
      - "ecosystem/specs/requirements-ci.txt"
      - "ecosystem/specs/contract-validation.md"
      - ".github/workflows/spec-contracts.yml"
  pull_request:
    paths:
      - "ecosystem/specs/**/*.json"
      - "ecosystem/specs/**/*.py"
      - "ecosystem/specs/**/*.sh"
      - "ecosystem/specs/requirements-ci.txt"
      - "ecosystem/specs/contract-validation.md"
      - ".github/workflows/spec-contracts.yml"
  workflow_dispatch:

jobs:
  json-schema-fixtures:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON Schemas and fixtures
        run: sh ecosystem/specs/ci-validate-contracts.sh
