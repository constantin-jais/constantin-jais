name: Governance

# Branch policy as code (ADR 0031): unit-test the policy engine on every
# governance PR, drift-check weekly and on governance changes, apply on
# merge to main. Not a required check itself - it gates policy, not code.
on:
  push:
    branches: [main]
    paths:
      - "ecosystem/governance/**"
      - ".github/workflows/governance.yml"
  pull_request:
    paths:
      - "ecosystem/governance/**"
      - ".github/workflows/governance.yml"
  workflow_dispatch:
    inputs:
      dump_repo:
        description: "OWNER/NAME to dump (onboarding aid); leave empty to apply the policy"
        required: false
        default: ""
  schedule:
    - cron: "43 6 * * 2"

permissions:
  contents: read

jobs:
  tests:
    name: Policy engine unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Unit tests (pure policy core)
        run: python3 -m unittest discover ecosystem/governance -v
      - name: Public repository profiles are coherent
        run: python3 ecosystem/governance/validate_repo_profiles.py
      - name: Policy file is valid against the engine
        run: |
          python3 - <<'EOF'
          import json, pathlib
          import sys
          sys.path.insert(0, "ecosystem/governance")
          import ecosystem_policy
          policy = ecosystem_policy.load_policy(
              pathlib.Path("ecosystem/governance/branch-policy.json")
          )
          for repo in policy["repos"]:
              ecosystem_policy.desired_ruleset(policy, repo)
          print(f"policy OK: {len(policy['repos'])} repo(s)")
          EOF

  drift-check:
    name: Drift check (live vs policy)
    needs: tests
    runs-on: ubuntu-latest
    # dispatch runs apply (which re-checks as post-condition); running both
    # would report a misleading red drift while apply is converging.
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Compare live branch protection to the merged policy
        env:
          GH_TOKEN: ${{ secrets.ECOSYSTEM_ADMIN_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::ECOSYSTEM_ADMIN_TOKEN not configured - drift check skipped (bootstrap: ecosystem/governance/README.md)"
            exit 0
          fi
          policy_args=()
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git show "${BASE_SHA}:ecosystem/governance/branch-policy.json" > /tmp/merged-branch-policy.json
            policy_args=(--policy /tmp/merged-branch-policy.json)
          fi
          if ! out="$(python3 ecosystem/governance/ecosystem_policy.py check "${policy_args[@]}" 2>&1)"; then
            if printf '%s' "$out" | grep -qiE "bad credentials|HTTP 401"; then
              echo "::warning::ECOSYSTEM_ADMIN_TOKEN invalid or expired - drift check skipped; renew it in Settings > Secrets"
              exit 0
            fi
            printf '%s\n' "$out"; exit 1
          fi
          printf '%s\n' "$out"

  apply:
    name: Apply policy
    needs: tests
    runs-on: ubuntu-latest
    # push to main (merged policy change) or manual dispatch (bootstrap,
    # re-convergence) - matching the runbook in ecosystem/governance/README.md.
    # A dispatch carrying dump_repo is an onboarding dump, not an apply.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.dump_repo == '')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Converge branch protection to the merged policy
        env:
          GH_TOKEN: ${{ secrets.ECOSYSTEM_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::ECOSYSTEM_ADMIN_TOKEN not configured - apply skipped (bootstrap: ecosystem/governance/README.md)"
            exit 0
          fi
          if ! out="$(python3 ecosystem/governance/ecosystem_policy.py apply 2>&1)"; then
            if printf '%s' "$out" | grep -qiE "bad credentials|HTTP 401"; then
              echo "::warning::ECOSYSTEM_ADMIN_TOKEN invalid or expired - apply skipped; renew it in Settings > Secrets"
              exit 0
            fi
            printf '%s\n' "$out"; exit 1
          fi
          printf '%s\n' "$out"

  dump:
    name: Dump live state (onboarding)
    needs: tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.dump_repo != ''
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Dump rulesets, legacy protection, and settings of the target repo
        env:
          GH_TOKEN: ${{ secrets.ECOSYSTEM_ADMIN_TOKEN }}
          DUMP_REPO: ${{ inputs.dump_repo }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::ECOSYSTEM_ADMIN_TOKEN not configured - dump needs it (bootstrap: ecosystem/governance/README.md)"
            exit 1
          fi
          python3 ecosystem/governance/ecosystem_policy.py dump --repo "${DUMP_REPO}"
